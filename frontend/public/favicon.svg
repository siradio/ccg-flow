<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Icône CCG Flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d63f0"/>
      <stop offset="1" stop-color="#143bb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#bcd1ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a1e66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tuile arrondie (style icône d'app) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- Flux : courbe montante reliant les nœuds (bas-gauche → haut-droite) -->
  <g filter="url(#soft)">
    <path d="M150 372 C 214 320, 236 300, 268 268 S 334 206, 378 150"
          fill="none" stroke="url(#flow)" stroke-width="22" stroke-linecap="round"/>
    <!-- branche réseau -->
    <path d="M268 268 L 196 214" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M268 268 L 326 338" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>

  <!-- Nœuds -->
  <g>
    <circle cx="150" cy="372" r="30" fill="#ffffff"/>
    <circle cx="196" cy="214" r="18" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="326" cy="338" r="16" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="268" cy="268" r="24" fill="#ffffff"/>
    <!-- nœud de destination, accentué -->
    <circle cx="378" cy="150" r="42" fill="#ffffff"/>
    <circle cx="378" cy="150" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10"/>
    <circle cx="378" cy="150" r="18" fill="#2d63f0"/>
  </g>
</svg>
