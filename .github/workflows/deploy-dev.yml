name: Deploy - Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write   # requis pour l'authentification Azure OIDC (pas de secret longue durée)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pas de `environment:` : ce champ changerait le "sub" du token OIDC envoyé à Azure
    # (repo:...:environment:X au lieu de repo:...:ref:refs/heads/develop), qui ne correspondrait
    # plus à l'identifiant fédéré "Branch"/develop configuré côté Azure AD (App Registration
    # shared-apps-github-actions).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assembler le paquet de déploiement (backend autonome)
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Installer les dépendances backend (production uniquement)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Infra partagée (§ SPEC.md déploiement Azure) : un Web App dédié par environnement
      # (ccgflow-dev), pas un slot sur une ressource unique — nom en dur plutôt qu'une variable
      # GitHub, puisque ce fichier ne sert jamais qu'à cet environnement.
      - name: Déployer sur ccgflow-dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: ccgflow-dev
          package: backend
