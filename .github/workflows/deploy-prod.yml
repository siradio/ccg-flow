name: Deploy - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # requis pour l'authentification Azure OIDC (pas de secret longue durée)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pas de `environment:` ici : ce champ change le "sub" du token OIDC envoyé à Azure
    # (repo:...:environment:X au lieu de repo:...:ref:refs/heads/main), qui ne correspondrait
    # plus à l'identifiant fédéré "Branch"/main configuré côté Azure AD (App Registration
    # shared-apps-github-actions) — remettre uniquement en ajoutant AUSSI un identifiant fédéré de
    # type "Environment" côté Azure si on veut activer des règles d'approbation GitHub plus tard.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        # VITE_API_URL en chemin relatif : le frontend est servi par le même backend Express
        # (backend/public), donc même origine — sans ça, Vite inline le fallback de dev
        # (http://localhost:4001/api) en dur dans le bundle, et l'app déployée appelle le
        # backend local de quiconque la teste au lieu du backend réellement déployé.
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Assembler le paquet de déploiement (backend autonome)
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Installer les dépendances backend (production uniquement)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Infra partagée (§ SPEC.md déploiement Azure) : un Web App dédié par environnement
      # (ccgflow-prod), pas un slot pour séparer dev et prod — nom en dur plutôt qu'une
      # variable GitHub, puisque ce fichier ne sert jamais qu'à cet environnement.
      # L'emplacement staging ci-dessous n'est pas un environnement : c'est le sas par
      # lequel passe chaque livraison pour que la bascule se fasse sans coupure.
      - name: Déployer sur l'emplacement staging de ccgflow-prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: ccgflow-prod
          slot-name: staging
          package: backend

      # L'adresse du staging porte un suffixe aléatoire : on la demande à Azure.
      - name: Adresse de l'emplacement staging
        id: slot
        run: |
          h=$(az webapp deployment slot list -n ccgflow-prod -g rg-shared-apps                 --query "[0].defaultHostName" -o tsv)
          echo "host=$h" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le staging répond
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20                    "https://${{ steps.slot.outputs.host }}/" || echo 000)
            echo "  essai $i : $code"
            case "$code" in 200|301|302|307|308|401|403) echo "staging opérationnel"; exit 0;; esac
            sleep 15
          done
          echo "Le staging ne répond pas — bascule annulée, la production est intacte."
          exit 1

      - name: Basculer staging vers production
        run: |
          az webapp deployment slot swap -n ccgflow-prod -g rg-shared-apps             --slot staging --target-slot production
          echo "Bascule effectuée. L'ancienne production est dans staging,"
          echo "prête à être rebasculée en cas de problème."
