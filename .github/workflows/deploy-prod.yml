name: Deploy - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # requis pour l'authentification Azure OIDC (pas de secret longue durée)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pas de `environment:` ici : ce champ change le "sub" du token OIDC envoyé à Azure
    # (repo:...:environment:X au lieu de repo:...:ref:refs/heads/main), qui ne correspondrait
    # plus à l'identifiant fédéré "Branch" configuré côté Azure AD (App Registration
    # ccg-flow-github-actions) — remettre uniquement en ajoutant AUSSI un identifiant fédéré de
    # type "Environment" côté Azure si on veut activer des règles d'approbation GitHub plus tard.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assembler le paquet de déploiement (backend autonome)
        run: |
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Installer les dépendances backend (production uniquement)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pas de `slot-name` pour l'instant : environnement unique le temps de finaliser le
      # déploiement (App Service Plan Basic, ne supporte pas les slots). Remettre
      # `slot-name: production` une fois passé en Standard + slot dev créé (voir deploy-dev.yml).
      - name: Déployer sur l'App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend
